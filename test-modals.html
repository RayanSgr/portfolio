<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Modals</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
        }
        .modal.active {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        button {
            padding: 1rem 2rem;
            margin: 1rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Test des Modals</h1>
    
    <button onclick="openModal('kooModal')">Ouvrir KOO2fourchette</button>
    <button onclick="openModal('infraModal')">Ouvrir M2L 1ère année</button>
    
    <!-- Modal KOO2fourchette -->
    <div id="kooModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('kooModal')">&times;</button>
            <h2>KOO2fourchette</h2>
            <p>Ceci est le modal de KOO2fourchette</p>
        </div>
    </div>
    
    <!-- Modal M2L 1ère année -->
    <div id="infraModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('infraModal')">&times;</button>
            <h2>M2L - Première année</h2>
            <p>Ceci est le modal de M2L 1ère année</p>
        </div>
    </div>
    
    <script>
        function openModal(modalId) {
            console.log('Opening modal:', modalId);
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                console.error('Modal not found:', modalId);
            }
        }
        
        function closeModal(modalId) {
            console.log('Closing modal:', modalId);
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        
        // Fermer avec Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.active').forEach(modal => {
                    closeModal(modal.id);
                });
            }
        });
        
        // Fermer en cliquant sur le fond
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal.id);
                }
            });
        });
    </script>
</body>
</html>
